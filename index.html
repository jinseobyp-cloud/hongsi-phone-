<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 카카오톡 인앱 브라우저 감지 시 즉시 상하단 검은 바가 없는 스마트폰 기본 브라우저(크롬/삼성인터넷)로 자동 전환
      if (/kakaotalk/i.test(navigator.userAgent)) {
        window.location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(window.location.href);
      }
      // PWA 원클릭 설치 프롬프트 전역 캡처
      window.deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredInstallPrompt = e;
      });
    </script>
    <link rel="icon" type="image/png" sizes="192x192" href="./hongsi_icon_192.png?v=5" />
    <link rel="icon" type="image/png" sizes="512x512" href="./hongsi_icon_512.png?v=5" />
    <link rel="shortcut icon" href="./hongsi_icon_192.png?v=5" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=5" />
    <link rel="manifest" href="./manifest.json?v=5" />
    <meta name="theme-color" content="#FFFFFF" id="theme-color-meta" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="홍시폰 V2" />
    <meta name="application-name" content="홍시폰 V2" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>홍시폰 V2 - 스마트폰 카드뉴스 제작 스튜디오</title>
    <!-- Pretendard Web Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  </head>
  <body class="bg-[#F8FAFC] dark:bg-slate-950 text-slate-900 antialiased selection:bg-orange-100 selection:text-orange-700 select-none touch-manipulation">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js?v=20261111_1340').then(function(reg) {
            reg.update();
            navigator.serviceWorker.addEventListener('controllerchange', function() {
              window.location.reload();
            });
          }).catch(function(e) {
            console.warn('SW registration failed:', e);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
